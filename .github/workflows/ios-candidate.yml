name: iOS candidate build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Record toolchain
        run: |
          mkdir -p logs
          xcodebuild -version | tee logs/toolchain.txt
          xcrun --sdk iphoneos --show-sdk-version | tee -a logs/toolchain.txt
      - name: Bootstrap pinned dependencies
        run: bash dependencies/vcpkg/bootstrap-vcpkg.sh
      - name: Generate original core project
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DBUILD_HEADLESS_DYLIB=ON -DCMAKE_MACOSX_BUNDLE=OFF -DMOLTENVK_LIBRARY="$GITHUB_WORKSPACE/MeloCafe/MeloCafe/Depedencies/MoltenVK.xcframework/ios-arm64/MoltenVK.framework/MoltenVK" -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO 2>&1 | tee logs/configure.txt
      - name: Build core dependencies in generated project
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --target CemuBin --parallel 3 -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee logs/core-build.txt
      - name: Build original app scheme without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project MeloCafe/MeloCafe.xcodeproj -scheme MeloCafe -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath out -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee logs/build.txt
      - name: Verify actual app before packaging
        shell: bash
        run: |
          set -euo pipefail
          app=out/Build/Products/Release-iphoneos/MeloCafe.app
          test -d "$app"
          plutil -lint "$app/Info.plist"
          # Reject accidental placeholder or unexpected app identity before publishing an IPA.
          actual_bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          test "$actual_bundle_id" = "com.stossy11.MeloCafe" || { echo "::error::Unexpected CFBundleIdentifier: $actual_bundle_id"; exit 1; }
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
          test -s "$app/$executable"
          file "$app/$executable" | tee logs/executable.txt
          file "$app/$executable" | grep -q arm64
          # Diagnostic manifest only: compare the unsigned candidate against
          # the official 1.0 release without modifying runtime binaries.
          {
            echo "=== Commit and toolchain ==="
            git rev-parse HEAD
            xcodebuild -version
            echo "=== App identity ==="
            /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$app/Info.plist" || true
            echo "=== App binary SHA256 ==="
            shasum -a 256 "$app/$executable"
            echo "=== Embedded executable/framework hashes ==="
            find "$app/Frameworks" -type f \( -perm -111 -o -name '*.dylib' \) -print0 2>/dev/null | sort -z | xargs -0 shasum -a 256 || true
            echo "=== App Info.plist ==="
            plutil -p "$app/Info.plist"
            echo "=== Provisioning and signature ==="
            if test -f "$app/embedded.mobileprovision"; then echo "Embedded profile present"; else echo "No embedded profile"; fi
            codesign -d --entitlements :- "$app" 2>&1 || true
          } > logs/candidate-manifest.txt 2>&1
          codesign -dv "$app" > logs/signature.txt 2>&1 || true
          {
            echo "=== Main executable load commands ==="
            xcrun otool -l "$app/$executable" | grep -E '^[[:space:]]*(cmd |name |path |platform |minos |sdk )' || true
            echo "=== Embedded framework binary load commands ==="
            for framework in "$app"/Frameworks/*.framework; do
              test -d "$framework" || continue
              framework_name=$(basename "$framework" .framework)
              framework_binary="$framework/$framework_name"
              test -f "$framework_binary" || continue
              echo "--- $framework_name ---"
              xcrun otool -l "$framework_binary" | grep -E '^[[:space:]]*(cmd |name |path |platform |minos |sdk )' || true
            done
          } > logs/macho-load-commands.txt 2>&1
          mkdir -p package/Payload
          cp -R "$app" package/Payload/
          cd package
          zip -qry ../MeloCafe-1.0-candidate-unsigned.ipa Payload
      - name: Compare unsigned candidate with official 1.0 release
        if: success()
        shell: bash
        run: |
          # Comparison only; never copy official frameworks into the candidate.
          set -uo pipefail
          mkdir -p logs
          python3 - <<'PY' > logs/official-comparison.txt 2>&1
          import hashlib, io, plistlib, urllib.request, zipfile
          official_url = "https://github.com/stossy11/MeloCafe/releases/download/1.0/MeloCafe.ipa"
          candidate_path = "MeloCafe-1.0-candidate-unsigned.ipa"
          def summarize(label, archive):
              apps = [n for n in archive.namelist() if n.startswith("Payload/") and n.endswith(".app/Info.plist") and n.count("/") == 2]
              if len(apps) != 1:
                  print(label, "unexpected app Info.plist count:", len(apps))
                  return
              prefix = apps[0][:-len("Info.plist")]
              info = plistlib.loads(archive.read(apps[0]))
              print("\n==", label, "==")
              for key in ("CFBundleIdentifier", "CFBundleExecutable", "CFBundleDisplayName", "MinimumOSVersion"):
                  print(key, repr(info.get(key)))
              exe = prefix + str(info.get("CFBundleExecutable", ""))
              if exe in archive.namelist():
                  data = archive.read(exe)
                  print("main executable size", len(data), "SHA256", hashlib.sha256(data).hexdigest())
              for n in sorted(archive.namelist()):
                  if n.startswith(prefix + "Frameworks/") and n.endswith(".framework/Info.plist"):
                      print("framework plist", n[len(prefix):])
                      try:
                          framework_info = plistlib.loads(archive.read(n))
                          binary_name = framework_info.get("CFBundleExecutable")
                          if binary_name:
                              framework_binary = n[:-len("Info.plist")] + binary_name
                              if framework_binary in archive.namelist():
                                  binary_data = archive.read(framework_binary)
                                  print("framework executable", framework_binary[len(prefix):],
                                        "size", len(binary_data),
                                        "SHA256", hashlib.sha256(binary_data).hexdigest())
                              else:
                                  print("framework executable missing", framework_binary[len(prefix):])
                      except Exception as exc:
                          print("framework inspection failed", n, type(exc).__name__, str(exc))
              print("embedded.mobileprovision", prefix + "embedded.mobileprovision" in archive.namelist())
          with zipfile.ZipFile(candidate_path) as z:
              summarize("unsigned candidate", z)
          try:
              request = urllib.request.Request(official_url, headers={"User-Agent": "MeloCafe-build-diagnostics"})
              with urllib.request.urlopen(request, timeout=90) as response:
                  payload = response.read()
              print("official IPA size", len(payload), "SHA256", hashlib.sha256(payload).hexdigest())
              with zipfile.ZipFile(io.BytesIO(payload)) as z:
                  summarize("official release 1.0", z)
          except Exception as exc:
              print("Official comparison unavailable:", type(exc).__name__, str(exc))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: logs
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MeloCafe-1.0-candidate-unsigned
          path: MeloCafe-1.0-candidate-unsigned.ipa
          if-no-files-found: error
